# Kaspad (Kaspa Node) Metrics Plugin

[plugin]
name = "kaspad"
description = "Kaspad node metrics from logs or Prometheus endpoint"

# Container matching rules (any match = plugin applies)
[[match]]
type = "image_contains"
value = "kaspad"

[[match]]
type = "name_contains"
value = "kaspad"

[[match]]
type = "name_contains"
value = "kaspa-mainnet"

[[match]]
type = "name_contains"
value = "kaspa-testnet"

# Fetcher configuration
# Use logs-based fetcher for both Docker containers and systemd services
[fetcher]
type = "logs"
lines = 100

# Metric definitions

# Block/DAG metrics
[[metrics]]
name = "blocks_processed"
regex_pattern = 'Processed\s+(\d+)\s+blocks'
display_format = "{value} blocks"
display_priority = "primary"
category = "blockchain"
refresh_interval_secs = 10
cache_duration_secs = 10

[[metrics]]
name = "transactions_processed"
regex_pattern = '\((\d+)\s+transactions'
display_format = "{value} txs"
display_priority = "secondary"
category = "blockchain"
refresh_interval_secs = 10
cache_duration_secs = 10

[[metrics]]
name = "avg_parents"
regex_pattern = '(\d+\.\d+)\s+parents'
display_format = "{value} parents"
display_priority = "detail"
category = "blockchain"
refresh_interval_secs = 10
cache_duration_secs = 10

# Network metrics - Add TPB (Transactions Per Block)
[[metrics]]
name = "tpb"
regex_pattern = '(\d+\.\d+)\s+TPB'
display_format = "{value} TPB"
display_priority = "detail"
category = "blockchain"
refresh_interval_secs = 10
cache_duration_secs = 10

[[metrics]]
name = "utps"
regex_pattern = '(\d+\.\d+)\s+u-tps'
display_format = "{value} u-tps"
display_priority = "detail"
category = "transactions"
refresh_interval_secs = 10
cache_duration_secs = 10

[[metrics]]
name = "etps_percent"
regex_pattern = '(\d+\.\d+)%\s+e-tps'
display_format = "{value}% e-tps"
display_priority = "detail"
category = "transactions"
refresh_interval_secs = 10
cache_duration_secs = 10

# Additional metrics extractable from logs
[[metrics]]
name = "utxo_validated_blocks"
regex_pattern = '(\d+)\s+UTXO-validated blocks'
display_format = "{value} UTXO-validated"
display_priority = "detail"
category = "blockchain"
refresh_interval_secs = 10
cache_duration_secs = 10

[[metrics]]
name = "avg_mergeset"
regex_pattern = '(\d+\.\d+)\s+mergeset'
display_format = "{value} mergeset"
display_priority = "detail"
category = "blockchain"
refresh_interval_secs = 10
cache_duration_secs = 10
